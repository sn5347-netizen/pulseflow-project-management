services:
  # 1. Backend REST API Service
  - type: web
    name: pulseflow-backend
    env: node
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npx prisma db push && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGIN
        value: "*"
      - key: DATABASE_URL
        fromDatabase:
          name: pulseflow-db
          property: connectionString

  # 2. Web Frontend Application (SPA)
  - type: static_site
    name: pulseflow-web
    rootDir: web
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

# 3. Free Managed PostgreSQL Database
databases:
  - name: pulseflow-db
    plan: free
