version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: pulseflow-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: pulseflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pulseflow-backend
    restart: always
    depends_on:
      - postgres
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: "postgresql://postgres:postgrespassword@postgres:5432/pulseflow?schema=public"
      JWT_SECRET: "pulseflow-super-secure-production-jwt-key-2026"
      JWT_EXPIRES_IN: "7d"
      CORS_ORIGIN: "http://localhost:3000"
    ports:
      - "5000:5000"

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: pulseflow-web
    restart: always
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:5000/api"
    ports:
      - "3000:3000"

volumes:
  postgres_data:

